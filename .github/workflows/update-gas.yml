name: WAGE Automatic Gasoline Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 2,5'

permissions:
  contents: write

concurrency:
  group: wage-gasoline-update
  cancel-in-progress: false

jobs:
  update-gasoline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect verified EIA gasoline data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update_data.py --online

      - name: Rebuild WAGE dashboard
        run: python build_site.py

      - name: Commit updated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eia_chicago_weekly.csv data/current.json index.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update verified EIA gasoline observations"
            git push
          fi
          
